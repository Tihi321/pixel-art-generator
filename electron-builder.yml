# Windows builds (x64): an NSIS installer (per user) and a portable single .exe. Build both with `yarn dist`.
# The app icon is build/icon.png (regenerate with `yarn gen:icon`).
appId: com.tihi321.pixel-studio
productName: Pixel Studio
copyright: Pixel Studio
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!out/**/*.map'
# No asar archive: the keyring .node file cannot be loaded from inside an archive, and the MCP stdio shim
# (out/mcp-stdio/index.js) must be runnable as a real file path by external MCP clients.
asar: false
extraResources:
  - from: seed
    to: seed
  - from: docs
    to: docs
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: Pixel-Studio-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
# Unpacks itself to a temp folder on every launch; settings and files still live in the user profile.
portable:
  artifactName: Pixel-Studio-${version}-portable.${ext}
